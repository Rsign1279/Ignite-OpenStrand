name: Application quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production and development dependencies
        run: node scripts/audit-dependencies.ts
      - name: Lint, types, unit tests, and production build
        run: npm run check
      - name: Install desktop, mobile, and Safari test engines
        run: npx playwright install --with-deps chromium webkit
      - name: Verify student flows, staff reports, accessibility, and recovery
        run: npm run test:e2e -- --workers=2
        env:
          PLAYWRIGHT_USE_BUILD: "1"
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
