name: Application quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Keep the browser dependency baseline stable when ubuntu-latest rolls forward.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production and development dependencies
        run: node scripts/audit-dependencies.ts
      - name: Use official Ubuntu HTTPS mirrors for browser dependencies
        run: |
          sudo python3 - <<'PYTHON'
          import pathlib, re
          paths = [pathlib.Path('/etc/apt/sources.list')]
          paths += list(pathlib.Path('/etc/apt/sources.list.d').glob('*.list'))
          paths += list(pathlib.Path('/etc/apt/sources.list.d').glob('*.sources'))
          for path in paths:
              if not path.is_file():
                  continue
              original = path.read_text()
              updated = re.sub(r'https?://(?:[A-Za-z0-9.-]+\.)?archive\.ubuntu\.com/ubuntu/?', 'https://archive.ubuntu.com/ubuntu/', original)
              updated = updated.replace('http://security.ubuntu.com/ubuntu', 'https://security.ubuntu.com/ubuntu')
              if updated != original:
                  path.write_text(updated)
          # Keep package signature verification and repository release settings.
          pathlib.Path('/etc/apt/apt.conf.d/80-ignite-download-timeouts').write_text('Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "2";\n')
          PYTHON
      - name: Install Redis for atomic admission regression tests
        run: |
          if ! command -v redis-server >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y redis-server
          fi
      - name: Lint, types, unit tests, and production build
        run: npm run check
      - name: Install desktop, mobile, and Safari test engines
        run: npx playwright install --with-deps chromium webkit
      - name: Verify student flows, staff reports, accessibility, and recovery
        run: npm run test:e2e -- --workers=2
        env:
          PLAYWRIGHT_USE_BUILD: "1"
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
